name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and pinned development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Show validated toolchain
        run: |
          python --version
          ruff --version
          black --version
          pytest --version

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check src tests

      - name: Pytest
        run: pytest --cov=semiconductor_rag --cov-report=term-missing
